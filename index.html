<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeSettle - Expense Splitter</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100">

<div class="container mx-auto max-w-5xl p-5">

    <!-- Header -->
    <div class="bg-green-600 rounded-xl text-white p-6 shadow-lg">

        <h1 class="text-4xl font-bold">
            💸 WeSettle
        </h1>

        <p class="mt-2 opacity-90">
            Simple Expense Splitter
        </p>

    </div>


    <!-- Dashboard -->

    <div class="grid md:grid-cols-3 gap-5 mt-6">

        <div class="card">
            <h3>Total Expenses</h3>
            <h2 id="totalExpense">₹0</h2>
        </div>

        <div class="card">
            <h3>Total Members</h3>
            <h2 id="memberCount">0</h2>
        </div>

        <div class="card">
            <h3>This Month</h3>
            <h2 id="currentMonth"></h2>
        </div>

    </div>


    <!-- Members -->

    <div class="section">

    <h2>👥 Members</h2>

    <div id="memberList" class="flex flex-wrap gap-2 mt-4"></div>

    </div>


    <!-- Add Expense -->

    <div class="section">

        <h2>➕ Add Expense</h2>

        <div class="grid md:grid-cols-2 gap-4 mt-5">

            <input
                    id="expenseTitle"
                    class="input"
                    placeholder="Expense Title">

            <input
                    id="expenseAmount"
                    type="number"
                    class="input"
                    placeholder="Amount">


            <!-- Split Members -->
        <div class="form-section">

            <label>
                Split Among
            </label>

            <div id="splitMembers" class="split-members">
                <!-- Checkboxes generated by JS -->
            </div>

        </div>


        <!-- Paid By + Date Row -->

        <div class="expense-row">


            <div class="form-group">

                <label>
                    Paid By
                </label>

                <select id="paidBy">
                    <option value="">
                        Paid By
                    </option>
                </select>

            </div>



            <div class="form-group">

                <label>
                    Date
                </label>

                <input 
                    type="date"
                    id="expenseDate">

            </div>


        </div>

        </div>

        <button
                id="saveExpenseBtn"
                class="btn mt-5 w-full">

            Save Expense

        </button>

    </div>


    <!-- Expense List -->

    <div class="section">

        <div class="flex justify-between items-center">

            <h2>
                📋 Expenses
            </h2>

        </div>

        <div
                id="expenseList"
                class="mt-5 space-y-4">

        </div>

    </div>


    <!-- Settlement -->

    <div class="section">

        <h2>
            💰 Settlement
        </h2>

        <div
                id="settlementList"
                class="mt-5 space-y-3">

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
